[build]
target = "xtensa-esp32s3-espidf"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
runner = ["bash", "-c", "exec bash \"$(git rev-parse --show-toplevel)/scripts/device-test-runner.sh\" \"$@\"", "--"]
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32s3"
ESP_IDF_VERSION = "v5.5.2"
ESP_IDF_TOOLS_INSTALL_DIR = "custom:/opt/esp/idf-tools"
# bindgen needs the Xtensa-capable libclang that espup installs; without this
# it falls back to the host LLVM and fails with "unknown target triple xtensa".
LIBCLANG_PATH = "/home/esp/.espup/esp-clang"
# Base ESP-IDF has no OV2640/OV3660 sensor driver; this adds
# espressif/esp32-camera plus its bindings. See camera-extra.toml.
# Todo 14: espressif/mdns is an EXTRA managed component on ESP-IDF 5.5+
# (no in-tree components/mdns); it ships in net-extra.toml because
# camera-extra.toml is frozen. The env var is comma-separated
# (esp-idf-sys 0.38.1 try_from_env merges every listed file).
ESP_IDF_SYS_EXTRA_COMPONENTS_FILE = "/workspaces/rust/firmware/camera-extra.toml,/workspaces/rust/firmware/net-extra.toml,/workspaces/rust/firmware/rtsp-extra.toml"

# Uncomment this if you have moved the target dir by setting CARGO_TARGET_DIR or similar.
# Required for now due to embuild limitations.
ESP_IDF_SYS_ROOT_CRATE = "esp32s3-av-firmware"

# Firmware build knobs (non-secret), read by `src/settings.rs` with
# `option_env!`. Cargo exports this table to build scripts and rustc, so a plain
# `cargo build` resolves every knob without a `.env` file. An exported value
# still wins unless the entry says `force = true`, which keeps
# `VIDEO_WIDTH=320 ./scripts/build-firmware.sh` working as an override.
# Wi-Fi credentials are NOT here: they are secrets and arrive from the shell.
VIDEO_WIDTH = "640"
VIDEO_HEIGHT = "480"
VIDEO_FPS = "10"
VIDEO_JPEG_QUALITY = "12"
AUDIO_SAMPLE_RATE = "48000"
AUDIO_BITRATE = "64000"
FILE_SERVER_PORT = "80"
