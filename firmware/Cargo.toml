[workspace]
resolver = "2"
members = [
    "components/logging",
    "components/net",
    "components/storage",
    "components/media",
    "components/fileserver",
]

[workspace.package]
rust-version = "1.85"

[package]
name = "esp32s3-av-firmware"
version = "0.1.0"
edition = "2021"

rust-version = "1.85"

[dependencies]
esp-idf-sys = { version = "=0.38.1", features = ["binstart"] }
esp-idf-hal = "=0.47.0"
esp-idf-svc = "=0.53.0"
logging = { path = "components/logging" }
net = { path = "components/net" }
storage = { path = "components/storage" }
media = { path = "components/media" }
fileserver = { path = "components/fileserver" }

[features]
# Recording is on by default. `--no-default-features` is the compile-time kill
# switch: it drops `media/avi-recording` and no muxer code is linked.
default = ["avi-recording"]
avi-recording = ["media/avi-recording"]
# Boot-time on-device RTSP self-check against 127.0.0.1 (diagnostics only).
rtsp-selftest = []

[package.metadata.esp-idf-sys]
# Relative to this package dir. Pinned octal-PSRAM + test-headroom sdkconfig.
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults"]

[profile.release]
# Speed optimised, size aware. `opt-level = 3` deadlocked cargo on this
# dependency graph (futex wait, no compiler active), so use "s": still fully
# optimised, and it keeps the image inside the 4 MiB app partition.
opt-level = "s"
